<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每週一句 - 英語每週一句</title>
  <style>
    :root {
      --primary-orange: #f99d1c;
      --primary-orange-hover: #e08b12;
      --light-bg: #fffbf0;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #f0f0f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "微軟正黑體", sans-serif;
    }

    body {
      background-color: var(--light-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 40px;
      position: relative;
    }

    /* 頁面左上角標題與右上角天際線圖案 */
    .page-header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid #f3e5ca;
      position: relative;
    }

    .page-title {
      font-size: 1.25rem;
      color: #8c6d3f;
      font-weight: bold;
    }

    .skyline-svg {
      height: 32px;
      fill: none;
      stroke: #f0c987;
      stroke-width: 1.5;
    }

    /* 主要外框卡片 */
    .main-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    /* 橘色頂部 Banner */
    .banner {
      background: linear-gradient(135deg, #ffa726, #fb8c00);
      color: white;
      text-align: center;
      padding: 24px 20px 20px;
      position: relative;
    }

    .banner::before, .banner::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      top: 25px;
    }
    .banner::before { left: 20%; }
    .banner::after { right: 20%; }

    .banner h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .banner .sub-info {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 400;
    }

    /* 週次切換區塊 */
    .week-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 20px 20px 15px;
    }

    .nav-btn {
      background: linear-gradient(to right, #ffa726, #fb8c00);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(251, 140, 0, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(251, 140, 0, 0.4);
    }

    .nav-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .week-badge {
      background-color: #fff9ed;
      color: #333;
      font-weight: bold;
      padding: 10px 28px;
      border-radius: 25px;
      font-size: 1.05rem;
      border: 1px solid #ffe8cc;
    }

    /* 年級 Tab 切換列 */
    .grade-tabs {
      display: flex;
      justify-content: space-around;
      border-bottom: 2px solid var(--border-color);
      padding: 0 10px;
      margin-top: 5px;
    }

    .tab-item {
      padding: 12px 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab-item:hover {
      color: var(--primary-orange);
    }

    .tab-item.active {
      color: var(--primary-orange);
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--primary-orange);
      border-radius: 3px 3px 0 0;
    }

    .tab-item .dot-indicator {
      display: none;
      width: 6px;
      height: 6px;
      background-color: var(--primary-orange);
      border-radius: 50%;
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
    }

    .tab-item.active .dot-indicator {
      display: block;
    }

    /* 句子顯示卡片區 */
    .content-area {
      padding: 30px 25px 20px;
    }

    .quote-card {
      background-color: #f9fbfd;
      border-radius: 16px;
      padding: 25px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      border: 1px solid #edf2f7;
      min-height: 110px;
    }

    .quote-icon {
      font-size: 2.2rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quote-text-container {
      flex-grow: 1;
    }

    .quote-en {
      font-size: 1.45rem;
      font-weight: bold;
      color: #2d3748;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .quote-zh {
      font-size: 1.05rem;
      color: #718096;
      line-height: 1.4;
    }

    /* 播放按鈕與速度切換區 */
    .audio-control-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 35px;
    }

    .play-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffa726, #fb8c00);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(251, 140, 0, 0.4);
      transition: all 0.2s ease;
      margin-bottom: 30px;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(251, 140, 0, 0.5);
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      margin-left: 3px; /* 播放圖示微調居中 */
    }

    .play-btn.playing svg {
      margin-left: 0;
    }

    /* 速度按鈕區 */
    .speed-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .speed-btn {
      background-color: white;
      border: 1.5px solid #e2e8f0;
      color: #64748b;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .speed-btn:hover {
      border-color: #cbd5e1;
      color: #334155;
    }

    .speed-btn.active {
      background-color: var(--primary-orange);
      border-color: var(--primary-orange);
      color: white;
      box-shadow: 0 4px 10px rgba(251, 140, 0, 0.3);
    }

    /* 載入與提示 */
    .loading-text {
      color: #a0aec0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- 頂部頁面標頭 -->
  <header class="page-header">
    <div class="page-title">每週一句</div>
    <svg class="skyline-svg" viewBox="0 0 200 40">
      <path d="M0,38 L10,38 L10,25 L18,25 L18,38 L30,38 L30,15 L40,15 L40,38 L55,38 L55,30 L65,30 L65,38 L80,38 L80,10 L90,5 L100,10 L100,38 L115,38 L115,20 L125,20 L125,38 L140,38 L140,12 L150,12 L150,38 L165,38 L165,28 L175,28 L175,38 L200,38" />
    </svg>
  </header>

  <!-- 主要內容卡片 -->
  <main class="main-card">
    
    <!-- 橘色 Banner -->
    <section class="banner">
      <h1>英語每週一句</h1>
      <div id="sub-date-info" class="sub-info">第 - 週 | ----/--/--</div>
    </section>

    <!-- 週次導覽按鈕 -->
    <section class="week-nav">
      <button class="nav-btn" id="prev-week-btn" onclick="changeWeek(-1)">◄ 上一週</button>
      <div class="week-badge" id="current-week-text">第 - 週</div>
      <button class="nav-btn" id="next-week-btn" onclick="changeWeek(1)">下一週 ►</button>
    </section>

    <!-- 年級 Tab 標籤 -->
    <nav class="grade-tabs">
      <div class="tab-item active" onclick="switchGrade('G1', this)">🌱 G1<span class="dot-indicator"></span></div>
      <div class="tab-item" onclick="switchGrade('G2', this)">🌿 G2<span class="dot-indicator"></span></div>
      <div class="tab-item" onclick="switchGrade('G3', this)">🌳 G3<span class="dot-indicator"></span></div>
      <div class="tab-item" onclick="switchGrade('G4', this)">🌲 G4<span class="dot-indicator"></span></div>
      <div class="tab-item" onclick="switchGrade('G5', this)">🌴 G5<span class="dot-indicator"></span></div>
      <div class="tab-item" onclick="switchGrade('G6', this)">🎓 G6<span class="dot-indicator"></span></div>
    </nav>

    <!-- 句子卡片區塊 -->
    <section class="content-area">
      <div class="quote-card">
        <div class="quote-icon">📚</div>
        <div class="quote-text-container">
          <div id="quote-en" class="quote-en">Loading...</div>
          <div id="quote-zh" class="quote-zh">載入中...</div>
        </div>
      </div>
    </section>

    <!-- 播放器與速度控制區 -->
    <section class="audio-control-area">
      <!-- 大圓形播放按鈕 -->
      <button class="play-btn" id="play-btn" onclick="togglePlay()" title="播放發音">
        <svg id="play-icon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <!-- 播放速度選擇按鈕列 -->
      <div class="speed-options">
        <button class="speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
        <button class="speed-btn" onclick="setSpeed(0.75, this)">0.75x</button>
        <button class="speed-btn active" onclick="setSpeed(1.0, this)">1x</button>
        <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25x</button>
        <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5x</button>
        <button class="speed-btn" onclick="setSpeed(2.0, this)">2x</button>
      </div>
    </section>

  </main>

  <script>
    // ==========================================
    // ⚙️ 設定區（填寫您的 Google 試算表 ID）
    // ==========================================
    const SHEET_ID = 'YOUR_GOOGLE_SHEET_ID_HERE'; // 貼上試算表 ID
    const SHEET_NAME = ''; // 工作表名稱（若留空預設第一個）

    // 預設示範資料（當未設定 SHEET_ID 或連線失敗時使用）
    const DEMO_DATA = [
      { week: 7, date: '2026/10/11', grade: 'G1', en: 'Try again.', zh: '再試一次。' },
      { week: 7, date: '2026/10/11', grade: 'G2', en: 'Good job!', zh: '做得好！' },
      { week: 7, date: '2026/10/11', grade: 'G3', en: 'Never give up.', zh: '永不放棄。' },
      { week: 7, date: '2026/10/11', grade: 'G4', en: 'Practice makes perfect.', zh: '熟能生巧。' },
      { week: 7, date: '2026/10/11', grade: 'G5', en: 'Knowledge is power.', zh: '知識就是力量。' },
      { week: 7, date: '2026/10/11', grade: 'G6', en: 'Where there is a will, there is a way.', zh: '有志者事竟成。' },
      { week: 8, date: '2026/10/18', grade: 'G1', en: 'Listen carefully.', zh: '仔細聆聽。' },
      { week: 8, date: '2026/10/18', grade: 'G2', en: 'Have a nice day.', zh: '祝你有美好的一天。' },
    ];

    // 全局狀態變數
    let allQuotesData = [];
    let availableWeeks = [];
    let currentWeekIndex = 0;
    let currentGrade = 'G1';
    let currentSpeed = 1.0;
    let isPlaying = false;

    // 解析 CSV 資料
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') { cur += '"'; i++; } 
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push(cur.trim()); cur = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(cur.trim());
          if (row.length > 1 || row[0] !== '') lines.push(row);
          row = []; cur = '';
        } else { cur += c; }
      }
      if (cur || row.length > 0) {
        row.push(cur.trim());
        if (row.length > 1 || row[0] !== '') lines.push(row);
      }
      return lines;
    }

    // 從 Google 試算表或本地備份載入資料
    async function loadSheetData() {
      if (SHEET_ID && SHEET_ID !== 'YOUR_GOOGLE_SHEET_ID_HERE') {
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${SHEET_NAME ? `&sheet=${encodeURIComponent(SHEET_NAME)}` : ''}`;
        try {
          const res = await fetch(csvUrl);
          if (res.ok) {
            const csvText = await res.text();
            const rows = parseCSV(csvText);
            
            // 欄位標頭搜尋 (欄位 A:週, B:日期, C:年級, D:英語, E:中文)
            if (rows.length > 1) {
              allQuotesData = [];
              for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (r.length >= 4) {
                  const weekNum = parseInt(String(r[0]).replace(/[^\d]/g, ''), 10);
                  if (!isNaN(weekNum)) {
                    allQuotesData.push({
                      week: weekNum,
                      date: r[1] || '',
                      grade: (r[2] || 'G1').toUpperCase(),
                      en: r[3] || '',
                      zh: r[4] || ''
                    });
                  }
                }
              }
            }
          }
        } catch (e) {
          console.warn('使用本地範例資料。', e);
        }
      }

      if (allQuotesData.length === 0) {
        allQuotesData = DEMO_DATA;
      }

      // 提取並排序所有出現過的「週次」
      const weekSet = new Set(allQuotesData.map(item => item.week));
      availableWeeks = Array.from(weekSet).sort((a, b) => a - b);
      
      // 預設選擇最新的或最接近今天的週次
      currentWeekIndex = availableWeeks.length - 1;

      updateUI();
    }

    // 更新畫面顯示
    function updateUI() {
      if (availableWeeks.length === 0) return;

      const currentWeek = availableWeeks[currentWeekIndex];

      // 更新按鈕狀態
      document.getElementById('prev-week-btn').disabled = (currentWeekIndex === 0);
      document.getElementById('next-week-btn').disabled = (currentWeekIndex === availableWeeks.length - 1);

      // 尋找當前「週次 + 年級」對應的句子
      const matched = allQuotesData.find(item => item.week === currentWeek && item.grade === currentGrade);

      const weekText = `第 ${currentWeek} 週`;
      const dateText = matched ? matched.date : '----/--/--';

      document.getElementById('current-week-text').textContent = weekText;
      document.getElementById('sub-date-info').textContent = `${weekText} | ${dateText}`;

      if (matched) {
        document.getElementById('quote-en').textContent = matched.en || '（無內容）';
        document.getElementById('quote-zh').textContent = matched.zh || '（無翻譯）';
      } else {
        document.getElementById('quote-en').textContent = 'No content';
        document.getElementById('quote-zh').textContent = '本週尚無該年級內容';
      }
    }

    // 切換週次
    function changeWeek(direction) {
      const newIndex = currentWeekIndex + direction;
      if (newIndex >= 0 && newIndex < availableWeeks.length) {
        currentWeekIndex = newIndex;
        stopSpeech();
        updateUI();
      }
    }

    // 切換年級 Tab
    function switchGrade(grade, element) {
      currentGrade = grade;
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      stopSpeech();
      updateUI();
    }

    // 設定聲音播放速度
    function setSpeed(speed, element) {
      currentSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      // 如果正在播放中，重新以新速度朗讀
      if (isPlaying) {
        togglePlay(); // 停止
        setTimeout(() => togglePlay(), 100); // 重新開始
      }
    }

    // 播放 / 暫停語音朗讀
    function togglePlay() {
      if ('speechSynthesis' in window) {
        if (isPlaying) {
          stopSpeech();
        } else {
          const text = document.getElementById('quote-en').textContent;
          if (!text || text === 'Loading...' || text === 'No content') return;

          window.speechSynthesis.cancel(); // 清空先前播放隊列
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = currentSpeed; // 設定速度

          utterance.onend = () => setPlayState(false);
          utterance.onerror = () => setPlayState(false);

          window.speechSynthesis.speak(utterance);
          setPlayState(true);
        }
      } else {
        alert('您的瀏覽器不支援語音發音功能。');
      }
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setPlayState(false);
    }

    // 更新播放按鈕圖示狀態
    function setPlayState(playing) {
      isPlaying = playing;
      const btn = document.getElementById('play-btn');
      const icon = document.getElementById('play-icon');

      if (playing) {
        btn.classList.add('playing');
        // 暫停圖示 (Pause)
        icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        btn.classList.remove('playing');
        // 播放圖示 (Play)
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', loadSheetData);
  </script>
</body>
</html>
